name: Beneath the Broken Chain
description: >
  Dark Sun Seed Pack for Khaldur. The player creates a character, then begins
  as an Arena slave under Malkor Tain. Survival, faction politics, false water
  scarcity, and Rajaat's buried contingency drive a sandbox after the opening
  prison arc. Source material: planning/darksun/water (Beneath the Broken Chain).
